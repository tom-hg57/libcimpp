name: Build & Test on Windows

on: [push, pull_request]

env:
  BUILD_TYPE: Release

permissions:
  checks: write
  contents: read
  issues: read
  pull-requests: write

jobs:
  build-and-test:
    name: Build & Test
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    # Cache the compiled vcpkg packages to drastically reduce build times on subsequent workflow runs
    # Cache only the vcpkg binary cache directory (avoids absolute path issues)
    - name: Cache vcpkg binaries
      uses: actions/cache@v6
      with:
        path: ${{github.workspace}}/vcpkg_binary_cache
        key: vcpkg-windows-${{ hashFiles('.github/workflows/build-windows.yml') }}
        restore-keys: vcpkg-windows-

    # Load the MSVC environment so that Ninja uses cl.exe (MSVC) instead of gcc (MinGW)
    - name: Enable MSVC for Ninja
      uses: TheMrMilchmann/setup-msvc-dev@v4
      with:
        arch: x64

    - name: Install Dependencies
      env:
        VCPKG_BINARY_SOURCES: "clear;files,${{github.workspace}}/vcpkg_binary_cache,readwrite"
      run: |
        vcpkg install boost-test:x64-windows
        vcpkg install libxml2:x64-windows

    - name: Configure CMake
      shell: pwsh
      run: >
        $vcpkgRoot = if (Test-Path "C:\vcpkg") { "C:\vcpkg" } else { $env:VCPKG_ROOT };
        cmake -B ${{github.workspace}}/build -G Ninja -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
        -DCMAKE_TOOLCHAIN_FILE="$vcpkgRoot/scripts/buildsystems/vcpkg.cmake"

    - name: Build
      run: cmake --build ${{github.workspace}}/build --parallel 4

    - name: Test
      working-directory: ${{github.workspace}}/build
      shell: pwsh
      run: |
        # Prevent Windows from displaying blocking hard-error modal dialogs for missing DLLs
        Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Windows' -Name 'ErrorMode' -Value 2
        Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\Windows Error Reporting' -Name 'DontShowUI' -Value 1 -ErrorAction SilentlyContinue

        # Locate vcpkg runtime DLL directory and copy required DLLs next to the test executable
        $vcpkgBin = if (Test-Path "C:\vcpkg\installed\x64-windows\bin") { "C:\vcpkg\installed\x64-windows\bin" } else { "$env:VCPKG_ROOT\installed\x64-windows\bin" }
        if (Test-Path $vcpkgBin) {
          Copy-Item "$vcpkgBin\*.dll" -Destination "test" -Force -ErrorAction SilentlyContinue
          $env:PATH = "$vcpkgBin;" + $env:PATH
        }
        Copy-Item "*.dll" -Destination "test" -Force -ErrorAction SilentlyContinue
        $env:PATH = "${{github.workspace}}/build;" + $env:PATH

        ctest --output-on-failure --output-junit test-results.xml --timeout 60 -V

    - name: Publish Test Results
      uses: EnricoMi/publish-unit-test-result-action/windows@v2
      if: ${{ !cancelled() }}
      with:
        files: "${{github.workspace}}/build/test-results.xml"
