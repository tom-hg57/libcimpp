name: Build & Test on Windows

on: push

env:
  BUILD_TYPE: Release

jobs:
  build-and-test:
    name: Build & Test
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    # Cache the compiled vcpkg packages to drastically reduce build times on subsequent workflow runs
    # Cache only the vcpkg binary cache directory (avoids absolute path issues)
    - name: Cache vcpkg binaries
      uses: actions/cache@v6
      with:
        path: ${{github.workspace}}/vcpkg_binary_cache
        key: vcpkg-windows-${{ hashFiles('.github/workflows/build-windows.yml') }}
        restore-keys: |
          vcpkg-windows-

    - name: Install Dependencies
      env:
        VCPKG_BINARY_SOURCES: "clear;files,${{github.workspace}}/vcpkg_binary_cache,readwrite"
      run: |
        vcpkg install boost-test:x64-windows
        vcpkg install boost-filesystem:x64-windows
        vcpkg install boost-system:x64-windows
        vcpkg install libxml2:x64-windows

    - name: Configure CMake
      run: >
        cmake -B ${{github.workspace}}/build
        -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --parallel 4

    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ctest --build-config ${{env.BUILD_TYPE}} --output-on-failure
