name: Build & Test on Windows

on: push

env:
  BUILD_TYPE: Release

jobs:
  build-and-test:
    name: Build & Test
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    # Cache the compiled vcpkg packages to drastically reduce build times on subsequent workflow runs
    - name: Restore vcpkg cache
      uses: actions/cache@v6
      with:
        path: |
          C:/vcpkg/installed
          C:/vcpkg/downloads
          C:/vcpkg/packages
        key: vcpkg-windows-${{ hashFiles('.github/workflows/build-windows.yml') }}
        restore-keys: |
          vcpkg-windows-

    # Load the MSVC environment so that Ninja uses cl.exe (MSVC) instead of gcc (MinGW)
    - name: Enable MSVC for Ninja
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install Dependencies
      run: |
        vcpkg install boost-test:x64-windows
        vcpkg install boost-filesystem:x64-windows
        vcpkg install boost-system:x64-windows
        vcpkg install libxml2:x64-windows

    - name: Configure CMake
      run: >
        cmake -B ${{github.workspace}}/build -G Ninja -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
        -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

    - name: Build
      run: cmake --build ${{github.workspace}}/build --parallel 4

    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ctest --output-on-failure
